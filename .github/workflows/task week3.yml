name : Task CI/CD
on :
  push:
    branches:
      - main

jobs:
  job1:
    runs-on: ubuntu-latest
    steps:
        - name: say hi
          run: echo "Helloooooo"
  job2:
    needs: job1
    runs-on: ubuntu-latest
    steps:
        - name: say welcome
          run: echo "welcome to task3"
  
  job3:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run unit tests
        run: |
          python -m unittest discover -s tests -v
